name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests + data checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: adharaai/requirements-prod.txt

      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libmagic1

      # Same packages as the production image (no PyTorch), plus test tools.
      - name: Install dependencies
        run: |
          pip install -r adharaai/requirements-prod.txt
          pip install pytest onnx pandas

      - name: Data quality gate
        run: python ml/validate_data.py adharaai/Data/adharaai_deployment_ready_v3.csv

      - name: Unit tests
        working-directory: adharaai
        env:
          APP_ENV: development
        run: python -m pytest -q tests

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Rules-only build (no HF_MODEL_REPO): proves the Dockerfile works on
      # every change without needing model weights.
      - name: Build image
        run: docker build --platform linux/amd64 -t adharaai:ci .
      - name: Smoke test /health
        run: |
          docker run -d --name app -p 9000:9000 \
            -e APP_ENV=development adharaai:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:9000/health/ ; then exit 0; fi
            sleep 1
          done
          docker logs app
          exit 1
